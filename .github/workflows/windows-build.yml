name: Windows Desktop Build

on:
  push:
    branches: [main, feature/windows-installer]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check application
        run: python -m compileall -q main.py

      - name: Package desktop application
        run: pyinstaller --noconfirm --clean --windowed --name Car-Debadger --collect-all PySide6 main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
          & $iscc.FullName 'installer\Car-Debadger.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: Car-Debadger-Windows
          path: |
            dist/installer/Car-Debadger-Setup.exe
            dist/Car-Debadger/**
          if-no-files-found: error
          retention-days: 30
